[package]
name = "nzotek-connector"
version = "0.1.0"
edition = "2021"
authors = ["gorin <mxmgorin@gmail.com>"]

[dependencies]
flurl = { git = "https://github.com/MyJetTools/fl-url.git", tag = "0.7.0", features = ["with-ring-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
